<html><head><title>Careers - Initech</title></head><body>
<h1>Senior Python Engineer</h1><p>Initech is hiring a Python engineer. 5 years experience.</p>
<input type="search" aria-label="Search jobs" placeholder="Search jobs">
<a id="entry" href="#">Apply now</a>
<form id="appform" style="display:none">
 <label for="fn">First name *</label><input id="fn" required>
 <label for="ln">Last name *</label><input id="ln" required>
 <label for="em">Email *</label><input id="em" type="email" required>
 <label for="ph">Phone</label><input id="ph" type="tel">
 <label for="edu">Highest qualification *</label>
 <select id="edu" required><option value="">Select...</option><option>High school</option><option>Bachelor's degree</option><option>Master's degree</option></select>
 <label for="sal">Expected salary *</label><input id="sal" required>
 <label for="cv">Resume *</label><input id="cv" type="file" required>
 <label for="why">Why do you want to work at Initech? *</label><textarea id="why" required></textarea>
 <button type="submit" id="go">Submit application</button>
</form>
<script>
 window.__sent = null;
 document.getElementById('entry').onclick = e => { e.preventDefault(); document.getElementById('appform').style.display = 'block'; };
 document.getElementById('appform').onsubmit = e => { e.preventDefault();
   window.__sent = {fn: fn.value, ln: ln.value, em: em.value, ph: ph.value, edu: edu.value, sal: sal.value,
                    file: cv.files.length ? cv.files[0].name : null};
   document.body.innerHTML = '<h1>Thank you for applying!</h1><p>Your application has been received.</p>'; };
</script></body></html>
